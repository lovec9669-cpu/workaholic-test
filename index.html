/* =========================================================
   狀態
========================================================= */

let currentQuestion = 0;

let answers = new Array(TOTAL_QUESTIONS).fill(null);

let userName = "";
let userBirthday = "";


/* =========================================================
   Fisher-Yates 洗牌
   每題選項順序會重新排列。
   
   注意：
   答案儲存的是「原始選項 index」，
   所以即使畫面上的 A/B/C/D 位置改變，
   分析時仍然可以正確對應。
========================================================= */

function shuffleOptions(questionIndex) {

    const arr = [0, 1, 2, 3];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}


/* =========================================================
   每題目前畫面上的排列
========================================================= */

let currentOrder = [];


/* =========================================================
   開始測驗
========================================================= */

function startTest() {

    userName =
        document.getElementById("name").value.trim();

    userBirthday =
        document.getElementById("birthday").value;

    const error =
        document.getElementById("startError");

    error.textContent = "";

    if (!userName) {

        error.textContent = "請輸入姓名。";
        return;
    }

    if (!userBirthday) {

        error.textContent = "請輸入生日。";
        return;
    }

    currentQuestion = 0;

    answers =
        new Array(TOTAL_QUESTIONS).fill(null);

    document
        .getElementById("startPage")
        .classList.add("hidden");

    document
        .getElementById("quizPage")
        .classList.remove("hidden");

    renderQuestion();
}


/* =========================================================
   顯示題目
========================================================= */

function renderQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber")
        .textContent =
        `QUESTION ${String(currentQuestion + 1).padStart(2, "0")}`;

    document.getElementById("questionText")
        .textContent = q.text;

    document.getElementById("progressText")
        .textContent =
        `第 ${currentQuestion + 1} 題`;

    const percentage =
        ((currentQuestion + 1) / TOTAL_QUESTIONS) * 100;

    document.getElementById("progressFill")
        .style.width = percentage + "%";

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    /*
       如果之前沒有建立排列，就建立一次。
       回上一題時必須維持同一個排列。
    */

    if (!currentOrder[currentQuestion]) {

        currentOrder[currentQuestion] =
            shuffleOptions(currentQuestion);
    }

    const order =
        currentOrder[currentQuestion];

    order.forEach((originalIndex, displayIndex) => {

        const button =
            document.createElement("button");

        button.className = "option";

        if (answers[currentQuestion] === originalIndex) {
            button.classList.add("selected");
        }

        const labels = ["A", "B", "C", "D"];

        button.innerHTML =
            `<span class="option-label">
                ${labels[displayIndex]}.
            </span>
            ${q.options[originalIndex]}`;

        button.onclick = () => {

            answers[currentQuestion] =
                originalIndex;

            document
                .querySelectorAll(".option")
                .forEach(btn =>
                    btn.classList.remove("selected")
                );

            button.classList.add("selected");

            document.getElementById("quizError")
                .textContent = "";
        };

        optionsContainer.appendChild(button);
    });


    document.getElementById("prevBtn")
        .style.visibility =
        currentQuestion === 0
            ? "hidden"
            : "visible";

    document.getElementById("nextBtn")
        .textContent =
        currentQuestion === TOTAL_QUESTIONS - 1
            ? "完成測驗"
            : "下一題";
}


/* =========================================================
   下一題
========================================================= */

function nextQuestion() {

    if (answers[currentQuestion] === null) {

        document.getElementById("quizError")
            .textContent =
            "請先選擇一個答案。";

        return;
    }

    if (currentQuestion < TOTAL_QUESTIONS - 1) {

        currentQuestion++;

        renderQuestion();

    } else {

        finishTest();
    }
}


/* =========================================================
   上一題
========================================================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        renderQuestion();
    }
}


/* =========================================================
   UTF-8 Base64 編碼
   讓中文姓名可以安全放進結果代碼。
========================================================= */

function encodeBase64Unicode(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


/* =========================================================
   產生結果資料

   注意：
   這裡不放心理測驗分數。
   只保存：
   - 版本
   - 姓名
   - 生日
   - 30題答案

   所以你收到代碼後，可以由分析端重新計算。
========================================================= */

function createResultData() {

    return {
        v: TEST_VERSION,
        name: userName,
        birthday: userBirthday,
        answers: answers
    };
}


/* =========================================================
   完成測驗
========================================================= */

function finishTest() {

    const resultData =
        createResultData();

    const json =
        JSON.stringify(resultData);

    const encoded =
        encodeBase64Unicode(json);

    const finalCode =
        `${TEST_VERSION}-${encoded}`;

    document
        .getElementById("quizPage")
        .classList.add("hidden");

    document
        .getElementById("resultPage")
        .classList.remove("hidden");

    document
        .getElementById("resultCode")
        .textContent = finalCode;
}


/* =========================================================
   複製結果
========================================================= */

function copyResultCode() {

    const code =
        document
            .getElementById("resultCode")
            .textContent;

    navigator.clipboard.writeText(code)
        .then(() => {

            const button =
                document.querySelector(".copy-btn");

            button.textContent = "已複製 ✓";

            setTimeout(() => {
                button.textContent =
                    "複製結果代碼";
            }, 1800);

        })
        .catch(() => {

            alert(
                "複製失敗，請手動選取結果代碼。"
            );
        });
}
